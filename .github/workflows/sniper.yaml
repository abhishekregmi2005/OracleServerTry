name: Oracle Capacity Sniper
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  snipe:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Write launch config
        env:
          OCI_AD: ${{ secrets.OCI_AD }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          cat > ${{ github.workspace }}/launch.json <<EOF
          {
            "availabilityDomain": "${OCI_AD}",
            "compartmentId": "${OCI_COMPARTMENT_ID}",
            "displayName": "AI-Server",
            "shape": "VM.Standard.A1.Flex",
            "shapeConfig": {
              "ocpus": 4,
              "memoryInGBs": 24
            },
            "sourceDetails": {
              "sourceType": "image",
              "imageId": "ocid1.image.oc1.us-chicago-1.aaaaaaaardyalqgy2m4yenctp5x54zmoukyhurifsae7zqwk345sekcircrq"
            },
            "subnetId": "${OCI_SUBNET_ID}",
            "createVnicDetails": {
              "subnetId": "${OCI_SUBNET_ID}",
              "assignPublicIp": true
            },
            "metadata": {
              "ssh_authorized_keys": "${SSH_PUBLIC_KEY}"
            }
          }
          EOF

      - name: Verify launch config
        run: cat ${{ github.workspace }}/launch.json

      - name: Launch Instance
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          silent: false
          command: compute instance launch --from-json file://${{ github.workspace }}/launch.json
