name: Oracle Capacity Sniper
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  snipe:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Write launch config
        env:
          OCI_AD: ${{ secrets.OCI_AD }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          jq -n \
            --arg ad "$OCI_AD" \
            --arg cid "$OCI_COMPARTMENT_ID" \
            --arg subnet "$OCI_SUBNET_ID" \
            --arg sshkey "$SSH_PUBLIC_KEY" \
            '{
              availabilityDomain: $ad,
              compartmentId: $cid,
              displayName: "AI-Server",
              shape: "VM.Standard.A1.Flex",
              shapeConfig: { ocpus: 4, memoryInGBs: 24 },
              sourceDetails: {
                sourceType: "image",
                imageId: "ocid1.image.oc1.us-chicago-1.aaaaaaaaqzxgc5f4hbxsoi4mhogsodroy5wgnvxcpuwpt77gt4wl3a3x6m2q"
              },
              subnetId: $subnet,
              createVnicDetails: {
                subnetId: $subnet,
                assignPublicIp: true
              },
              metadata: { ssh_authorized_keys: $sshkey }
            }' > ${{ github.workspace }}/launch.json

      - name: Install OCI CLI
        run: python -m pip install --user oci-cli

      - name: Launch Instance
        env:
          MAX_ATTEMPTS: 10
          RETRY_SECONDS: 60
        run: |
          set -u
          export PATH="$HOME/.local/bin:$PATH"

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::Launch attempt ${attempt}/${MAX_ATTEMPTS}"
            output="$(oci compute instance launch --from-json "file://${{ github.workspace }}/launch.json" 2>&1)"
            status=$?
            printf '%s\n' "$output"
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "Instance launch request accepted."
              exit 0
            fi

            if printf '%s\n' "$output" | grep -qi "Out of host capacity"; then
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                echo "OCI capacity is unavailable; retrying in ${RETRY_SECONDS}s."
                sleep "$RETRY_SECONDS"
                continue
              fi

              echo "OCI capacity is unavailable after ${MAX_ATTEMPTS} attempts; ending without failing the workflow."
              exit 0
            fi

            echo "OCI launch failed for a non-capacity reason."
            exit "$status"
          done
