name: Oracle Capacity Sniper
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  snipe:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Write launch config
        run: |
          cat > launch.json <<'EOF'
          {
            "availabilityDomain": "LAtS:US-CHICAGO-1-AD-1",
            "compartmentId": "${{ secrets.OCI_COMPARTMENT_ID }}",
            "shape": "VM.Standard.A1.Flex",
            "shapeConfig": {
              "ocpus": 4,
              "memoryInGBs": 24
            },
            "subnetId": "${{ secrets.OCI_SUBNET_ID }}",
            "imageId": "ocid1.image.oc1.us-chicago-1.aaaaaaaardyalqgy2m4yenctp5x54zmoukyhurifsae7zqwk345sekcircrq",
            "createVnicDetails": {
              "assignPublicIp": true,
              "subnetId": "${{ secrets.OCI_SUBNET_ID }}"
            },
            "metadata": {
              "ssh_authorized_keys": "${{ secrets.SSH_PUBLIC_KEY }}"
            },
            "displayName": "AI-Server"
          }
          EOF

      - name: Launch Instance
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          silent: false
          command: compute instance launch --from-json file://launch.json
