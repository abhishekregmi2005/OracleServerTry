name: Oracle Capacity Sniper
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  snipe:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Launch Instance
        run: |
          oci compute instance launch \
            --availability-domain "LAtS:US-CHICAGO-1-AD-1" \
            --compartment-id "${{ secrets.OCI_COMPARTMENT_ID }}" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":4,"memoryInGBs":24}' \
            --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
            --image-id "ocid1.image.oc1.us-chicago-1.aaaaaaaardyalqgy2m4yenctp5x54zmoukyhurifsae7zqwk345sekcircrq" \
            --assign-public-ip true \
            --ssh-authorized-keys-file "ssh_key.pub" \
            --display-name "AI-Server"
