name: Oracle Capacity Sniper

on:
  schedule:
    - cron: '7 0,5,10,15,20 * * *'
    - cron: '22 1,6,11,16,21 * * *'
    - cron: '37 2,7,12,17,22 * * *'
    - cron: '52 3,8,13,18 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: oracle-capacity-sniper
  cancel-in-progress: true

jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAX_ATTEMPTS: 10
      RETRY_SECONDS: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install --quiet oci requests

      - name: Check for existing instance
        id: existing
        env:
          OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
        run: |
          pip install --quiet oci-cli
          for ad in "eqhO:US-CHICAGO-1-AD-1" "eqhO:US-CHICAGO-1-AD-2" "eqhO:US-CHICAGO-1-AD-3"; do
            instances=$(oci compute instance list \
              --compartment-id "$OCI_COMPARTMENT_ID" \
              --availability-domain "$ad" \
              --display-name "AI-Dev-Server" \
              --all --output json 2>/dev/null || echo '{"data":[]}')
            found=$(echo "$instances" | jq -r '[.data[] | select(.["lifecycle-state"] != "TERMINATED")] | length')
            if [ "$found" -gt 0 ]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "Existing instance found in $ad. Skipping."
              exit 0
            fi
          done
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "No existing instance found. Proceeding."

      - name: Run sniper
        if: steps.existing.outputs.found != 'true'
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: python launch.py
