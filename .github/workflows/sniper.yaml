name: Oracle Capacity Sniper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  snipe:
    runs-on: ubuntu-latest

    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Write Launch Config
        env:
          OCI_AD: ${{ secrets.OCI_AD }}
          OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          
          cat > launch.json << 'EOF'
          {
            "availabilityDomain": "${OCI_AD}",
            "compartmentId": "${OCI_COMPARTMENT_ID}",
            "displayName": "AI-Server-${TIMESTAMP}",
            "shape": "VM.Standard.A1.Flex",
            "shapeConfig": {
              "ocpus": 4,
              "memoryInGBs": 24
            },
            "sourceDetails": {
              "sourceType": "image",
              "imageId": "ocid1.image.oc1.us-chicago-1.aaaaaaaaqzxgc5f4hbxsoi4mhogsodroy5wgnvxcpuwpt77gt4wl3a3x6m2q"
            },
            "subnetId": "${OCI_SUBNET_ID}",
            "createVnicDetails": {
              "subnetId": "${OCI_SUBNET_ID}",
              "assignPublicIp": true
            },
            "metadata": {
              "ssh_authorized_keys": "${SSH_PUBLIC_KEY}"
            },
            "availabilityConfig": {
              "isLiveMigrationPreferred": false
            }
          }
          EOF

          # Substitute variables
          sed -i "s|\${OCI_AD}|$OCI_AD|g" launch.json
          sed -i "s|\${OCI_COMPARTMENT_ID}|$OCI_COMPARTMENT_ID|g" launch.json
          sed -i "s|\${OCI_SUB